name: dotnet-messaging-demo
services:
  orders-db:
    image: postgres:17
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["orders-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d orders"]
      interval: 3s
      timeout: 3s
      retries: 30
  billing-db:
    image: postgres:17
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports: ["127.0.0.1:55433:5432"]
    volumes: ["billing-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d billing"]
      interval: 3s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:19092:19092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 30
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "orders.created.v1", "--partitions", "3", "--replication-factor", "1"]
  orders-api:
    build:
      context: .
      args: {SERVICE: Orders.Api}
    ports: ["127.0.0.1:5080:8080"]
    environment:
      ConnectionStrings__Database: Host=orders-db;Database=orders;Username=demo;Password=demo
      Kafka__BootstrapServers: kafka:9092
    depends_on:
      orders-db: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
  billing-api:
    build:
      context: .
      args: {SERVICE: Billing.Api}
    ports: ["127.0.0.1:5081:8080"]
    environment:
      ConnectionStrings__Database: Host=billing-db;Database=billing;Username=demo;Password=demo
      Kafka__BootstrapServers: kafka:9092
    depends_on:
      billing-db: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
volumes:
  orders-data:
  billing-data:
  kafka-data:
